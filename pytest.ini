[pytest]
# The installed `dash` ships a pytest plugin that fails to import against the
# installed `werkzeug` (get_current_traceback was removed), and a plugin that
# raises on import takes down collection for the whole suite — not just the
# tests that touch it. Neither package is used by this project; dash is an
# unrelated resident of the same venv. Disabling its plugin is the narrow fix,
# and it keeps `pytest` working with no extra flags on the command line.
addopts = -p no:dash
markers =
    slow: downloads pretrained weights / does heavier compute, skip by default with `-m "not slow"`
